FROM golang:1.26.4-alpine AS builder

WORKDIR /

COPY go.mod go.sum ./

RUN go mod download

COPY . .

# Build a Linux static executable from the GraphQL composition root.
RUN CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o /out/graphql-api ./cmd/graphql-api

# Runtime stage; excludes the Go compiler and source code.
FROM alpine:3.22

# Certificates support outbound HTTPS connections, if needed.
RUN apk add --no-cache ca-certificates

# Copy only the compiled executable from the builder stage.
COPY --from=builder /out/graphql-api /usr/local/bin/graphql-api

# The GraphQL server listens on port 8081.
EXPOSE 8081

CMD ["/usr/local/bin/graphql-api"]

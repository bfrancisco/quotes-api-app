schema:
  - internal/transport/graphql/schema.graphqls

exec:
  filename: internal/transport/graphql/generated/generated.go
  package: generated

model:
  filename: internal/transport/graphql/generated/models_gen.go
  package: generated

resolver:
  layout: follow-schema
  dir: internal/transport/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

models:
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Quote:
    model:
      - github.com/bfrancisco/quotes-api-app/internal/model.Quote
